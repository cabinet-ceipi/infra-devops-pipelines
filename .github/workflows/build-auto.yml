name: 🐳 Docker Build & Push (Reusable – Manual Tag)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Chemin vers le Dockerfile"
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: "Contexte Docker"
        required: false
        type: string
        default: .
      image_tag:
        description: "Tag Docker saisi par l'utilisateur (ex: prod, v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐞 Debug input
        run: |
          echo "image_tag reçu : '${{ inputs.image_tag }}'"
          if [ -z "${{ inputs.image_tag }}" ]; then
            echo "❌ image_tag est vide"
            exit 1
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker image tag
        id: docker_tag
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "✅ Image générée : ${IMAGE}"

      - name: 🏗️ Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.docker_tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Summary
        run: |
          echo "🐳 Image Docker poussée avec succès"
          echo "Registry :  ${{ env.REGISTRY }}"
          echo "Repo     :  ${{ env.IMAGE_NAME }}"
          echo "Tag      :  ${{ inputs.image_tag }}"
          echo "Full     :  ${{ steps.docker_tag.outputs.image }}"
