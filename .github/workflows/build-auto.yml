name: 🐳 Docker Build & Push - Main Branch (Reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: ./Dockerfile
      context:
        required: false
        type: string
        default: .
      image_tag:
        required: true
        type: string
        description: "Tag Docker à utiliser (ex: v1.0.0, latest, prod)"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Check branch (main only)
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "❌ Ce workflow ne peut être exécuté que depuis la branche main"
            exit 1
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Generate Docker tag (manual)
        id: tags
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${{ inputs.image_tag }}"

          if [ -z "$TAG" ]; then
            echo "❌ Le tag Docker est obligatoire"
            exit 1
          fi

          echo "tags=${IMAGE_BASE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: 📄 Copy .env.devops to .env
        run: |
          if [ -f .env.devops ]; then
            cp .env.devops .env
            echo ".env.devops copied to .env"
          else
            echo "No .env.devops file found, skipping copy."
          fi

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Output image info
        run: |
          echo "🐳 Image construite et poussée :"
          echo "  Registry:   ${{ env.REGISTRY }}"
          echo "  Repository: ${{ env.IMAGE_NAME }}"
          echo "  Tag:        ${{ steps.tags.outputs.tag }}"
          echo "  Full image: ${{ steps.tags.outputs.tags }}"
