name: 🏷️ Docker Build & Push - Release Tag (Reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: ./Dockerfile
      context:
        required: false
        type: string
        default: .

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Docker tag from release
        id: tags
        run: |
          TAG_NAME="${{ github.ref_name }}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          
          # Supprimer le préfixe 'v' si présent (v2.0.0 -> 2.0.0)
          VERSION="${TAG_NAME#v}"
          
          # latest seulement pour les releases stables (sans -rc, -beta, -alpha)
          # Regex: uniquement X.Y.Z (semver strict)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${IMAGE_BASE}:${VERSION},${IMAGE_BASE}:latest"
            IS_STABLE="true"
          else
            TAGS="${IMAGE_BASE}:${VERSION}"
            IS_STABLE="false"
          fi
          
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_stable=${IS_STABLE}" >> "$GITHUB_OUTPUT"

      - name: 📄 Copy .env.devops to .env
        run: |
          if [ -f .env.devops ]; then
            cp .env.devops .env
            echo "✅ .env.devops copied to .env"
          else
            echo "⚠️ No .env.devops file found, skipping copy."
          fi

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: 📝 Output image info
        run: |
          echo "══════════════════════════════════════════════"
          echo "🐳 Image construite et poussée avec succès !"
          echo "══════════════════════════════════════════════"
          echo ""
          echo "📦 Registry:      ${{ env.REGISTRY }}"
          echo "📁 Repository:    ${{ env.IMAGE_NAME }}"
          echo "🏷️  Tag original:  ${{ steps.tags.outputs.tag_name }}"
          echo "📌 Version:       ${{ steps.tags.outputs.version }}"
          echo "🔖 Tags générés:  ${{ steps.tags.outputs.tags }}"
          echo "✅ Release stable: ${{ steps.tags.outputs.is_stable }}"
          echo "🔗 Commit SHA:    ${{ github.sha }}"
          echo ""
          echo "══════════════════════════════════════════════"
