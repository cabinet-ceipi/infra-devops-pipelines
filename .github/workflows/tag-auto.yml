name: 🐳 Docker Build & Push - Main Branch (Reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: ./Dockerfile
      context:
        required: false
        type: string
        default: .
      version:
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # requis pour tag + release
      packages: write

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout complet (tags inclus)
      # ─────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Docker Buildx
      # ─────────────────────────────────────────────
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────
      # 3. Login GHCR
      # ─────────────────────────────────────────────
      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # 4. Détermination de la version (SemVer)
      # ─────────────────────────────────────────────
      - name: 🔢 Determine Docker version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            COMMITS="Version forcée manuellement."
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

            if [ -z "$LAST_TAG" ]; then
              VERSION="v0.1.0"
              COMMITS=$(git log --pretty="- %s")
            else
              COMMITS=$(git log ${LAST_TAG}..HEAD --pretty="- %s")

              MAJOR=$(echo $LAST_TAG | sed 's/v//' | cut -d. -f1)
              MINOR=$(echo $LAST_TAG | sed 's/v//' | cut -d. -f2)
              PATCH=$(echo $LAST_TAG | sed 's/v//' | cut -d. -f3)

              if echo "$COMMITS" | grep -qi "BREAKING CHANGE"; then
                VERSION="v$((MAJOR+1)).0.0"
              elif echo "$COMMITS" | grep -qi "^-\ feat"; then
                VERSION="v${MAJOR}.$((MINOR+1)).0"
              else
                VERSION="v${MAJOR}.${MINOR}.$((PATCH+1))"
              fi
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # 5. Préparation .env
      # ─────────────────────────────────────────────
      - name: 📄 Copy .env.devops to .env
        run: |
          if [ -f .env.devops ]; then
            cp .env.devops .env
          fi

      # ─────────────────────────────────────────────
      # 6. Build & Push Docker
      # ─────────────────────────────────────────────
      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─────────────────────────────────────────────
      # 7. Création du tag Git
      # ─────────────────────────────────────────────
      - name: 🏷️ Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag déjà existant"
          else
            git tag -a "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
            git push origin "${{ env.VERSION }}"
          fi

      # ─────────────────────────────────────────────
      # 8. Création de la Release GitHub (précise)
      # ─────────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            ## 🚀 Release ${{ env.VERSION }}

            ### 📌 Changements inclus
            ${{ env.COMMITS }}

            ### 🐳 Image Docker
            ```
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```

            ### 🔄 Rollback
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```

            ---
            Release générée automatiquement via GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
